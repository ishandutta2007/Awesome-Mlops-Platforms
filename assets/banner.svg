<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.12); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes nodePulse {
        0%, 100% { r: 4; fill-opacity: 0.8; }
        50% { r: 6.5; fill-opacity: 1; }
      }
      @keyframes circuitGlow {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.6; }
      }

      .bg-pulse-1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: 250px 180px;
      }
      .bg-pulse-2 {
        animation: pulseGlow 9s ease-in-out infinite reverse;
        transform-origin: 950px 220px;
      }
      .circuit-line {
        stroke-dasharray: 8 6;
        animation: dashMove 4s linear infinite;
      }
      .circuit-line-fast {
        stroke-dasharray: 6 4;
        animation: dashMove 2.5s linear infinite;
      }
      .pulsing-node {
        animation: nodePulse 3s ease-in-out infinite;
      }
      .circuit-group {
        animation: circuitGlow 5s ease-in-out infinite;
      }
      .floating-pill-left {
        animation: floatSlow1 6s ease-in-out infinite;
      }
      .floating-pill-right {
        animation: floatSlow2 7s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- Subtle Ambient Glow Orbs in Background -->
  <circle cx="200" cy="140" r="180" fill="url(#glowGrad1)" class="bg-pulse-1" filter="url(#softGlow)"/>
  <circle cx="1000" cy="240" r="200" fill="url(#glowGrad2)" class="bg-pulse-2" filter="url(#softGlow)"/>

  <!-- Background Tech Grid Pattern -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="550" y1="0" x2="550" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
    <line x1="850" y1="0" x2="850" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1150" y1="0" x2="1150" y2="400"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- Dynamic Animated Circuit & Pipeline Lines (Flanking the sides) -->
  <g class="circuit-group">
    <!-- Left Pipeline Circuit -->
    <path d="M 40 200 L 120 200 L 180 130 L 260 130" fill="none" stroke="#38bdf8" stroke-width="2" class="circuit-line"/>
    <path d="M 60 270 L 150 270 L 210 320 L 290 320" fill="none" stroke="#818cf8" stroke-width="1.5" class="circuit-line-fast"/>
    
    <!-- Left Circuit Nodes -->
    <circle cx="120" cy="200" r="4" fill="#38bdf8" class="pulsing-node"/>
    <circle cx="180" cy="130" r="4" fill="#818cf8"/>
    <circle cx="260" cy="130" r="5" fill="#38bdf8"/>
    <circle cx="210" cy="320" r="3.5" fill="#c084fc"/>

    <!-- Right Pipeline Circuit -->
    <path d="M 940 130 L 1020 130 L 1080 200 L 1160 200" fill="none" stroke="#c084fc" stroke-width="2" class="circuit-line"/>
    <path d="M 910 320 L 990 320 L 1050 270 L 1140 270" fill="none" stroke="#38bdf8" stroke-width="1.5" class="circuit-line-fast"/>

    <!-- Right Circuit Nodes -->
    <circle cx="940" cy="130" r="4" fill="#c084fc"/>
    <circle cx="1080" cy="200" r="5" fill="#f472b6" class="pulsing-node"/>
    <circle cx="990" cy="320" r="4" fill="#38bdf8"/>
    <circle cx="1140" cy="270" r="4" fill="#818cf8"/>
  </g>

  <!-- Floating Dynamic Tech Pills (Positioned safely away from center title) -->
  <g class="floating-pill-left" filter="url(#badgeShadow)">
    <!-- Pill 1: Top Left -->
    <g transform="translate(60, 48)">
      <rect width="180" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#38bdf8"/>
      <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">EXPERIMENT TRACKING</text>
    </g>
    <!-- Pill 2: Bottom Left -->
    <g transform="translate(70, 320)">
      <rect width="165" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#818cf8" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#818cf8"/>
      <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">MODEL REGISTRY</text>
    </g>
  </g>

  <g class="floating-pill-right" filter="url(#badgeShadow)">
    <!-- Pill 3: Top Right -->
    <g transform="translate(960, 48)">
      <rect width="175" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#c084fc" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#c084fc"/>
      <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">GENAI OBSERVABILITY</text>
    </g>
    <!-- Pill 4: Bottom Right -->
    <g transform="translate(970, 320)">
      <rect width="160" height="34" rx="17" fill="#1e293b" fill-opacity="0.85" stroke="#34d399" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#34d399"/>
      <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">ML PIPELINES &amp; CI/CD</text>
    </g>
  </g>

  <!-- Centered Content Wrapper (Z-index: Foreground - clear and never obscured) -->
  <g transform="translate(600, 0)" text-anchor="middle">
    <!-- Top Category Tag -->
    <g transform="translate(0, 80)">
      <rect x="-140" y="-16" width="280" height="32" rx="16" fill="url(#accentGrad)" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.2"/>
      <text y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">⚡ THE CURATED MLOPS DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text y="165" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-1" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
      Awesome MLOps Platforms
    </text>

    <!-- Subtitle -->
    <text y="215" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="0.3">
      Curated Ecosystem of SaaS Products &amp; Open-Source Projects for ML Engineering
    </text>

    <!-- Core Pillars Feature Bar -->
    <g transform="translate(0, 270)">
      <rect x="-340" y="-20" width="680" height="40" rx="20" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" filter="url(#badgeShadow)"/>
      
      <circle cx="-250" cy="0" r="4" fill="#38bdf8"/>
      <text x="-238" y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">Experiment Tracking</text>
      
      <circle cx="-85" cy="0" r="4" fill="#818cf8"/>
      <text x="-73" y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">Model Registries</text>
      
      <circle cx="80" cy="0" r="4" fill="#c084fc"/>
      <text x="92" y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">LLMOps &amp; Tracing</text>
      
      <circle cx="230" cy="0" r="4" fill="#34d399"/>
      <text x="242" y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start">Pipeline CI/CD</text>
    </g>

    <!-- Subtle Footer Metric / Tagline -->
    <text y="340" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" letter-spacing="0.5">
      🚀 100K+ GitHub Stars Aggregated • 🔍 Evaluated Across Pricing, Free Tiers &amp; Architecture
    </text>
  </g>

  <!-- Border Highlight -->
  <rect width="1200" height="400" rx="16" fill="none" stroke="#1e293b" stroke-width="2"/>
</svg>